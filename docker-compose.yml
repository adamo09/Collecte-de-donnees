# =====================================================================
# CADERAC — Collecte terrain — Environnement de développement
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: caderac_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caderac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caderac}
      POSTGRES_DB: ${POSTGRES_DB:-caderac}
      # Le tri et les messages en français, cohérents avec les données terrain.
      LANG: fr_FR.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caderac} -d ${POSTGRES_DB:-caderac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: caderac_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caderac}:${POSTGRES_PASSWORD:-caderac}@db:5432/${POSTGRES_DB:-caderac}
      SECRET_KEY: ${SECRET_KEY:-cle_de_developpement_uniquement}
      ENVIRONNEMENT: ${ENVIRONNEMENT:-developpement}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Le scénario de recette est monté en lecture seule : il s'exécute
      # depuis le conteneur, qui porte déjà ses dépendances. Rien à
      # installer sur le poste de l'exploitant.
      - ./scripts:/scripts:ro
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    # Image Debian et non Alpine : même famille de bibliothèque C que les
    # postes de développement habituels. Vite dépend d'esbuild et de
    # rollup, qui embarquent des binaires natifs propres à la plateforme.
    image: node:22-slim
    container_name: caderac_web
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /app
    environment:
      # Le front appelle l'API en relatif (/api/v1) ; c'est le serveur de
      # développement Vite qui achemine. Aucune URL n'est compilée dans le
      # bundle, si bien que le même build sert en local et en production.
      URL_API: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules vit dans un volume dédié, jamais sur le disque de
      # l'hôte : sans cela, les binaires natifs installés par le conteneur
      # écraseraient ceux du poste, et « npm run dev » cesserait de
      # fonctionner en dehors de Docker. Le volume évite aussi de
      # réinstaller à chaque démarrage.
      - modules_web:/app/node_modules
      - ./backend/openapi.json:/backend/openapi.json:ro
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  donnees_postgres:
  modules_web:
